<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scanner Check-in (Standalone)</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 12px; background: #0f172a; color: #e2e8f0;
    font-family: -apple-system, Roboto, Arial, sans-serif; font-size: 15px;
  }
  .app { max-width: 460px; margin: 0 auto; }
  h1 { font-size: 17px; margin: 0 0 2px; }
  .sub { color: #94a3b8; font-size: 12px; margin-bottom: 14px; line-height: 1.5; }
  .card { background: #1e293b; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 5px; }
  input {
    width: 100%; padding: 12px; border: 1px solid #334155; border-radius: 8px;
    background: #0f172a; color: #e2e8f0; font-size: 16px;
  }
  input#kode { font-family: monospace; letter-spacing: 1px; text-transform: uppercase; }
  button {
    width: 100%; padding: 13px; border: 0; border-radius: 8px; margin-top: 8px;
    font-size: 15px; font-weight: 700; color: #fff; background: #2563eb; cursor: pointer;
  }
  button.alt { background: #475569; }
  /* Container kamera WAJIB punya lebar nyata sebelum scanner dinyalakan.
     Karena itu disembunyikan lewat class .off, bukan :empty. */
  #reader { width: 100%; border-radius: 10px; overflow: hidden; background: #000; }
  #reader.off { display: none; }
  #reader video { width: 100% !important; height: auto !important; display: block; }
  #reader__scan_region > img { display: none; }
  #camList {
    width: 100%; padding: 10px; margin-top: 8px; border-radius: 8px;
    border: 1px solid #334155; background: #0f172a; color: #e2e8f0; font-size: 14px;
  }
  #camInfo { font-size: 11px; color: #64748b; margin-top: 6px; word-break: break-word; }
  .hasil { border-radius: 12px; padding: 18px; text-align: center; margin-bottom: 12px; display: none; }
  .hasil.on { display: block; }
  .hasil .ikon { font-size: 40px; line-height: 1; }
  .hasil .judul { font-size: 19px; font-weight: 800; margin: 6px 0; }
  .hasil .ket { font-size: 13px; opacity: .9; margin-top: 6px; }
  .hasil .kode { font-family: monospace; font-size: 12px; opacity: .75; margin-top: 8px; }
  .h-ok { background: #065f46; color: #d1fae5; }
  .h-warn { background: #92400e; color: #fef3c7; }
  .h-err { background: #991b1b; color: #fee2e2; }
  .note { font-size: 12px; color: #94a3b8; line-height: 1.5; }
  .hide { display: none; }
</style>
</head>
<body>
<div class="app">

  <div id="setup">
    <h1>Scanner Check-in — Standalone</h1>
    <div class="sub">
      Halaman ini berjalan di luar iframe Google, sehingga <b>kamera HP bisa dipakai</b>.
      Isi URL web app dan PIN panitia sekali saja; keduanya tersimpan di perangkat ini.
    </div>
    <div class="card">
      <label>URL Web App (.../exec)</label>
      <input id="url" placeholder="https://script.google.com/macros/s/AKfy.../exec">
      <label style="margin-top:10px;">PIN Panitia</label>
      <input id="pin" type="tel" inputmode="numeric" placeholder="••••••">
      <button onclick="simpan()">Simpan &amp; Mulai</button>
      <div id="setupMsg" class="note" style="margin-top:8px;color:#fca5a5;"></div>
    </div>
  </div>

  <div id="main" class="hide">
    <h1>Check-in</h1>
    <div class="sub">Scan QR e-ticket, atau ketik kodenya manual.</div>

    <div id="hasil" class="hasil"></div>

    <div class="card">
      <div id="reader" class="off"></div>
      <select id="camList" class="hide" onchange="gantiKamera()"></select>
      <div id="camNote" class="note hide"></div>
      <div id="camInfo"></div>
      <button id="btnCam" class="alt" onclick="toggleKamera()">Nyalakan Kamera</button>
    </div>

    <div class="card">
      <label>Kode Tiket (manual / scanner barcode USB)</label>
      <input id="kode" placeholder="TF26-0001-A1B2" autocomplete="off"
             onkeydown="if(event.key==='Enter') kirim(this.value)">
      <button onclick="kirim(document.getElementById('kode').value)">Check-in</button>
      <button class="alt" onclick="kirim(document.getElementById('kode').value, true)">Cek Status Saja</button>
      <button class="alt" onclick="resetSetup()">Ganti URL / PIN</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
var URL_EXEC = '', PIN = '', scanner = null, kameraAktif = false, sibuk = false;
var terakhir = '', terakhirWaktu = 0;

function simpan() {
  var u = document.getElementById('url').value.trim();
  var p = document.getElementById('pin').value.trim();
  if (!/\/exec$/.test(u)) {
    document.getElementById('setupMsg').textContent = 'URL harus diakhiri dengan /exec';
    return;
  }
  if (!p) { document.getElementById('setupMsg').textContent = 'PIN belum diisi.'; return; }

  URL_EXEC = u; PIN = p;
  try { localStorage.setItem('etix_url', u); localStorage.setItem('etix_pin', p); } catch (e) {}
  document.getElementById('setup').classList.add('hide');
  document.getElementById('main').classList.remove('hide');
  document.getElementById('kode').focus();
}

function resetSetup() {
  document.getElementById('setup').classList.remove('hide');
  document.getElementById('main').classList.add('hide');
}

function kirim(kode, cekSaja) {
  kode = String(kode || '').trim().toUpperCase();
  if (!kode || sibuk) return;

  var now = Date.now();
  if (kode === terakhir && now - terakhirWaktu < 3000) return;
  terakhir = kode; terakhirWaktu = now;

  sibuk = true;
  tampil('warn', '&#8987;', 'Memproses…', '', kode);

  var url = URL_EXEC + '?action=' + (cekSaja ? 'cek' : 'checkin') +
            '&code=' + encodeURIComponent(kode) + '&pin=' + encodeURIComponent(PIN);

  fetch(url, { method: 'GET', redirect: 'follow' })
    .then(function (r) { return r.json(); })
    .then(function (res) { sibuk = false; tampilHasil(res, kode); })
    .catch(function (e) {
      sibuk = false;
      tampil('err', '&#9888;', 'GAGAL TERHUBUNG',
        e.message + '<br>Periksa koneksi internet dan URL web app.', kode);
    });

  document.getElementById('kode').value = '';
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function tampilHasil(res, kode) {
  if (res.status === 'MASUK') {
    tampil('ok', '&#10004;', 'SILAKAN MASUK',
      esc(res.nama) + '<br>' + esc(res.jenis) + ' - ' + esc(res.jumlah) + ' orang', res.kode);
    getar([120, 60, 120]);
  } else if (res.status === 'SUDAH_MASUK') {
    tampil('warn', '&#8635;', 'SUDAH CHECK-IN',
      esc(res.nama) + '<br>' + esc(res.message), res.kode);
    getar([400]);
  } else if (res.status === 'INFO') {
    tampil('warn', '&#8505;', esc(res.statusBayar),
      esc(res.nama) + '<br>' + esc(res.statusCheckin), res.kode);
  } else {
    tampil('err', '&#10008;', 'TIDAK BOLEH MASUK',
      (res.nama ? esc(res.nama) + '<br>' : '') + esc(res.message), res.kode || kode);
    getar([300, 100, 300]);
  }
}

function tampil(jenis, ikon, judul, ket, kode) {
  var el = document.getElementById('hasil');
  el.className = 'hasil on h-' + jenis;
  el.innerHTML = '<div class="ikon">' + ikon + '</div><div class="judul">' + judul + '</div>' +
    (ket ? '<div class="ket">' + ket + '</div>' : '') +
    (kode ? '<div class="kode">' + esc(kode) + '</div>' : '');
}

function getar(pola) { try { if (navigator.vibrate) navigator.vibrate(pola); } catch (e) {} }

/* ============================================================
 *  KAMERA
 *  html5-qrcode mengukur lebar container saat start(). Kalau container
 *  masih display:none, video dirender berukuran nol — kamera menyala
 *  tapi layar kosong. Karena itu #reader ditampilkan lebih dulu.
 * ============================================================ */
var KAMERA = [];

function byId(id) { return document.getElementById(id); }

function toggleKamera() {
  if (kameraAktif) matikanKamera();
  else nyalakanKamera();
}

function nyalakanKamera() {
  var btn = byId('btnCam');

  if (typeof Html5Qrcode === 'undefined') {
    pesanKamera('Library scanner gagal dimuat. Periksa koneksi internet, lalu muat ulang halaman.');
    return;
  }
  if (!location.protocol.match(/^https:/) && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
    pesanKamera('Halaman ini dibuka lewat <b>' + esc(location.protocol) + '</b>. ' +
      'Browser hanya mengizinkan kamera pada <b>https://</b> atau <b>http://localhost</b>.<br>' +
      'Unggah berkas ini ke GitHub Pages / Netlify Drop / Cloudflare Pages, lalu buka dari sana.');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Menyalakan…';
  byId('camNote').classList.add('hide');
  byId('reader').classList.remove('off');   // tampilkan container SEBELUM start()

  scanner = scanner || new Html5Qrcode('reader', { verbose: false });
  setTimeout(pilihSumberKamera, 200);
}

function konfigScan() {
  return {
    fps: 10,
    qrbox: function (w, h) {
      var m = Math.floor(Math.min(w, h) * 0.7);
      return { width: m, height: m };
    },
    aspectRatio: 1.0,
    disableFlip: false,
    experimentalFeatures: { useBarCodeDetectorIfSupported: true }
  };
}

function onScan(teks) { kirim(teks); }

function pilihSumberKamera() {
  var urutan = [
    { facingMode: { exact: 'environment' } },
    { facingMode: 'environment' },
    { facingMode: 'user' }
  ];

  function coba(i) {
    if (i >= urutan.length) { cobaLewatDaftarKamera(); return; }
    scanner.start(urutan[i], konfigScan(), onScan, function () {})
      .then(kameraSiap)
      .catch(function () { coba(i + 1); });
  }
  coba(0);
}

function cobaLewatDaftarKamera() {
  Html5Qrcode.getCameras().then(function (devs) {
    KAMERA = devs || [];
    if (!KAMERA.length) throw new Error('Tidak ada kamera yang terdeteksi.');
    isiDaftarKamera();
    var belakang = KAMERA.filter(function (d) {
      return /back|rear|belakang|environment/i.test(d.label || '');
    })[0] || KAMERA[KAMERA.length - 1];
    return scanner.start(belakang.id, konfigScan(), onScan, function () {});
  }).then(kameraSiap).catch(gagalKamera);
}

function kameraSiap() {
  kameraAktif = true;
  var btn = byId('btnCam');
  btn.disabled = false;
  btn.textContent = 'Matikan Kamera';

  var v = document.querySelector('#reader video');
  if (v) {
    v.setAttribute('playsinline', 'true');  // iOS: tanpa ini video tidak tampil inline
    v.setAttribute('muted', 'true');
    v.style.width = '100%';
    v.style.height = 'auto';
    v.style.display = 'block';
    var p = v.play();
    if (p && p.catch) p.catch(function () {});
  }

  if (!KAMERA.length && Html5Qrcode.getCameras) {
    Html5Qrcode.getCameras().then(function (devs) {
      KAMERA = devs || []; isiDaftarKamera();
    }).catch(function () {});
  }

  setTimeout(function () {
    var vid = document.querySelector('#reader video');
    if (!vid || !vid.videoWidth) {
      byId('camInfo').textContent = '';
      pesanKamera('Kamera menyala tetapi gambar tidak muncul (video 0 piksel). ' +
                  'Coba pilih kamera lain pada daftar di atas, atau ketik kode manual.');
    } else {
      byId('camInfo').textContent =
        'Kamera aktif · ' + vid.videoWidth + '×' + vid.videoHeight +
        ' · arahkan QR ke dalam kotak';
    }
  }, 1500);
}

function gagalKamera(err) {
  var btn = byId('btnCam');
  kameraAktif = false;
  btn.disabled = false;
  btn.textContent = 'Nyalakan Kamera';
  byId('reader').classList.add('off');
  byId('camInfo').textContent = '';

  var nama = (err && err.name) ? err.name : '';
  var teks;
  if (nama === 'NotAllowedError' || /permission|denied|ditolak/i.test(String(err))) {
    teks = 'Izin kamera ditolak browser. Ketuk ikon gembok di address bar &rarr; ' +
           'Izin situs &rarr; Kamera &rarr; Izinkan, lalu muat ulang.';
  } else if (nama === 'NotFoundError' || /no camera|tidak ada kamera/i.test(String(err))) {
    teks = 'Tidak ada kamera yang terdeteksi pada perangkat ini.';
  } else if (nama === 'NotReadableError') {
    teks = 'Kamera sedang dipakai aplikasi lain. Tutup aplikasi kamera / video call, lalu coba lagi.';
  } else {
    teks = 'Kamera gagal dibuka: ' + esc(String(err));
  }
  pesanKamera(teks + '<br><br>Kode tiket tetap bisa diketik manual di bawah.');
}

function matikanKamera() {
  var btn = byId('btnCam');
  btn.disabled = true;
  scanner.stop().then(function () { scanner.clear(); })
    .catch(function () {})
    .then(function () {
      kameraAktif = false;
      btn.disabled = false;
      btn.textContent = 'Nyalakan Kamera';
      byId('reader').classList.add('off');
      byId('camInfo').textContent = '';
    });
}

function isiDaftarKamera() {
  if (KAMERA.length < 1) return;
  var sel = byId('camList');
  sel.innerHTML = KAMERA.map(function (d, i) {
    return '<option value="' + esc(d.id) + '">' +
           esc(d.label || ('Kamera ' + (i + 1))) + '</option>';
  }).join('');
  sel.classList.remove('hide');
}

function gantiKamera() {
  var id = byId('camList').value;
  if (!id || !scanner) return;

  byId('camNote').classList.add('hide');
  var lanjut = kameraAktif ? scanner.stop() : Promise.resolve();

  lanjut.then(function () {
    kameraAktif = false;
    byId('reader').classList.remove('off');
    return scanner.start(id, konfigScan(), onScan, function () {});
  }).then(kameraSiap).catch(gagalKamera);
}

function pesanKamera(html) {
  var note = byId('camNote');
  note.classList.remove('hide');
  note.innerHTML = html;
}

(function () {
  try {
    var u = localStorage.getItem('etix_url'), p = localStorage.getItem('etix_pin');
    if (u) document.getElementById('url').value = u;
    if (p) document.getElementById('pin').value = p;
    if (u && p) simpan();
  } catch (e) {}
})();
</script>
</body>
</html>
