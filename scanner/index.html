<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>OLA QR Scanner</title>
  <style>
    :root{--bg:#061725;--cyan:#32ddf3;--text:#effcff;--muted:#9ab9c5;--red:#ff6477}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,Arial,sans-serif;min-height:100vh;padding:18px}
    .app{max-width:600px;margin:auto}.brand{text-align:center;color:var(--cyan);font-size:22px;font-weight:800;margin:7px 0 18px}.viewer{position:relative;border:2px solid var(--cyan);border-radius:18px;overflow:hidden;background:#000;aspect-ratio:3/4}
    video,canvas{position:absolute;width:100%;height:100%;object-fit:cover}.frame{position:absolute;inset:20%;border:3px solid var(--cyan);border-radius:15px;box-shadow:0 0 0 999px #0006}.status{text-align:center;min-height:44px;padding:12px;color:var(--muted)}
    button,input{font:inherit}.btn{width:100%;padding:13px;border:0;border-radius:11px;background:var(--cyan);color:#05202b;font-weight:800;margin:7px 0}.btn.secondary{background:#173d52;color:#fff}.manual{margin-top:14px;padding:14px;background:#0b293c;border-radius:13px}.manual input{width:100%;padding:11px;border-radius:8px;border:1px solid #28516a;background:#061b29;color:#fff;margin-bottom:7px}
    .error{color:var(--red)}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
</head>
<body>
<div class="app">
  <div class="brand">OLA APHRODITE<br><small>QR CHECK-IN SCANNER</small></div>
  <div class="viewer"><video id="video" playsinline muted></video><canvas id="canvas" hidden></canvas><div class="frame"></div></div>
  <div id="status" class="status">Tekan Mulai Kamera / Start Camera</div>
  <button class="btn" id="start">Mulai Kamera / Start Camera</button>
  <button class="btn secondary" id="back">Kembali ke Admin</button>
  <div class="manual">
    <input id="manual" placeholder="Tempel QR payload secara manual">
    <button class="btn secondary" id="manualGo">Kirim ke Admin</button>
  </div>
</div>
<script>
  const q=new URLSearchParams(location.search);
  const returnUrl=q.get('returnUrl')||localStorage.getItem('olaAdminUrl')||'';
  const device=q.get('device')||localStorage.getItem('olaScannerDevice')||('SCN-'+Date.now().toString(36));
  if(returnUrl)localStorage.setItem('olaAdminUrl',returnUrl);localStorage.setItem('olaScannerDevice',device);
  const video=document.getElementById('video'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true}),status=document.getElementById('status');
  let stream=null,running=false,lastDetect=0;
  function go(raw){raw=String(raw||'').trim();if(!raw)return;if(!returnUrl){status.innerHTML='<span class="error">returnUrl dashboard admin belum dikonfigurasi.</span>';return}running=false;if(stream)stream.getTracks().forEach(t=>t.stop());const sep=returnUrl.includes('?')?'&':'?';location.href=returnUrl+sep+'scan='+encodeURIComponent(raw)+'&device='+encodeURIComponent(device)}
  async function start(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});video.srcObject=stream;await video.play();running=true;status.textContent='Arahkan kamera ke QR / Point camera at QR';requestAnimationFrame(tick)}catch(e){status.innerHTML='<span class="error">Kamera gagal: '+e.message+'</span>'}}
  async function tick(ts){if(!running)return;if(ts-lastDetect<180){requestAnimationFrame(tick);return}lastDetect=ts;if(video.readyState>=2){canvas.width=video.videoWidth;canvas.height=video.videoHeight;ctx.drawImage(video,0,0,canvas.width,canvas.height);try{if('BarcodeDetector'in window){const detector=new BarcodeDetector({formats:['qr_code']});const codes=await detector.detect(canvas);if(codes.length)return go(codes[0].rawValue)}else if(window.jsQR){const image=ctx.getImageData(0,0,canvas.width,canvas.height);const code=jsQR(image.data,image.width,image.height,{inversionAttempts:'dontInvert'});if(code)return go(code.data)}}catch(e){}}requestAnimationFrame(tick)}
  document.getElementById('start').onclick=start;document.getElementById('back').onclick=()=>{if(returnUrl)location.href=returnUrl};document.getElementById('manualGo').onclick=()=>go(document.getElementById('manual').value);
</script>
</body>
</html>
